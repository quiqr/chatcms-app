<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiqr ChatCMS — Content menu on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6BAA}a:hover{color:#08578C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7F5; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 52px 16px 12px; background: #FFFFFF; border-bottom: 1px solid #E5E5E2; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 32px; height: 32px; border-radius: 8px; background: #E6F2FB; color: #0A5A8F; font-weight: 650; font-size: 14px; display: flex; align-items: center; justify-content: center">T</span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">technative.eu</span><span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #52525B"><span style="width: 6px; height: 6px; border-radius: 50%; background: #16A34A"></span>All changes saved</span></span>
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #E6F2FB; color: #0A5A8F; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">PS</span>
    </div>
    <label style="height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 10px; background: #FBFBFA">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find content</span>
      <input type="search" placeholder="Find a page or post" style="border: 0; outline: 0; font: inherit; font-size: 16px; flex: 1; min-width: 0; background: transparent">
    </label>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <section style="display: flex; flex-direction: column; gap: 6px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #52525B">{{g.title}}</h2>
        <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 12px">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
            <li style="{{it.rowStyle}}">
              <a href="{{it.href}}" style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; text-decoration: none; color: #18181B; font-size: 15px">
                <sc-if value="{{it.collection}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6BAA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></sc-if>
                <sc-if value="{{it.single}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></sc-if>
                <span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.label}}</span>
                <sc-if value="{{it.changed}}" hint-placeholder-val="{{ false }}"><span aria-label="Unpublished changes" style="width: 7px; height: 7px; border-radius: 50%; background: #D97706; flex: none"></span></sc-if>
                <span style="font-size: 13px; color: #6B6B73">{{it.count}}</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 6l6 6-6 6"/></svg>
              </a>
            </li>
          </sc-for>
        </ul>
      </section>
    </sc-for>
  </main>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 26px; background: #FFFFFF; border-top: 1px solid #E5E5E2">
    <a href="PhoneContentMenu.dc.html" aria-current="page" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #0B6BAA; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Content</a>
    <a href="Media.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #52525B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Media</a>
    <a href="PhonePublish.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #52525B; text-decoration: none; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>Publish<span style="position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: #B45309; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span></a>
    <a href="History.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #52525B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>History</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const it = (label, o) => Object.assign({ label, collection: false, single: true, count: '', changed: false, href: 'PhoneEditor.dc.html' }, o || {});
    const coll = (label, count, changed) => it(label, { collection: true, single: false, count, changed: !!changed, href: 'PhoneCollection.dc.html' });
    const groups = [
      { title: 'Homepage', items: [it('Homepage – English'), it('Homepage – Dutch', { changed: true })] },
      { title: 'Services', items: [it('All service pages', { count: '8', href: 'PhoneContentMenu.dc.html' })] },
      { title: 'Blog', items: [coll('Blog posts', '48', true), it('Blog overview – English'), it('Blog overview – Dutch')] },
      { title: 'Cases', items: [coll('Customer cases', '12')] },
      { title: 'Settings', items: [it('Site configuration'), it('Footer menu')] }
    ];
    groups.forEach(g => g.items.forEach((x, i) => { x.rowStyle = i ? 'border-top: 1px solid #F1F1EE' : ''; }));
    return { groups };
  }
}
</script>
</body>
</html>
