<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiqr ChatCMS — Collection on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6BAA}a:hover{color:#08578C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7F5; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 52px 12px 12px; background: #FFFFFF; border-bottom: 1px solid #E5E5E2; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="PhoneContentMenu.dc.html" aria-label="Back to content" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18181B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #6B6B73">Blog</span><span style="font-size: 17px; font-weight: 600">Blog posts <span style="font-weight: 400; color: #6B6B73">· 48</span></span></span>
      <button type="button" aria-label="New post" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #18181B; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <label style="height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; margin: 0 4px; border: 1px solid #E5E5E2; border-radius: 10px; background: #FBFBFA">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search blog posts</span>
      <input type="search" placeholder="Search blog posts" style="border: 0; outline: 0; font: inherit; font-size: 16px; flex: 1; min-width: 0; background: transparent">
    </label>
    <div style="display: flex; align-items: center; gap: 6px; padding: 0 4px; overflow-x: auto">
      <button type="button" aria-pressed="true" style="height: 34px; padding: 0 12px; border: 1px solid #18181B; border-radius: 999px; background: #18181B; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap">All · 48</button>
      <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 13px; white-space: nowrap">Dutch · 30</button>
      <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 13px; white-space: nowrap">English · 18</button>
      <button type="button" style="height: 34px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: #3F3F46; white-space: nowrap; margin-left: auto"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>Newest</button>
    </div>
  </header>

  <main style="flex: 1; overflow: hidden; padding: 12px 16px">
    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 14px">
      <sc-for list="{{posts}}" as="p" hint-placeholder-count="6">
        <li style="{{p.rowStyle}}">
          <a href="PhoneEditor.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; text-decoration: none; color: inherit">
            <span style="width: 48px; height: 48px; border-radius: 8px; background: {{p.thumb}}; flex: none"></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 15px; font-weight: 500; line-height: 1.3">{{p.title}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B6B73"><span>{{p.date}}</span><sc-if value="{{p.badge}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 500; color: {{p.fg}}; background: {{p.bg}}; border-radius: 999px; padding: 1px 8px">{{p.status}}</span></sc-if></span>
            </span>
          </a>
        </li>
      </sc-for>
    </ul>
  </main>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 8px 26px; background: #FFFFFF; border-top: 1px solid #E5E5E2">
    <a href="PhoneContentMenu.dc.html" aria-current="page" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #0B6BAA; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Content</a>
    <a href="Media.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #52525B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Media</a>
    <a href="PhonePublish.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #52525B; text-decoration: none; position: relative"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>Publish<span style="position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: #B45309; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span></a>
    <a href="History.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #52525B; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg>History</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = { Changed: ['#92400E', '#FEF3E2'], Draft: ['#3F3F46', '#F1F1EE'] };
    const raw = [
      ['What FinOps taught us about cloud waste', '12 Nov · English', 'Changed', '#D9E2E8'],
      ['Kubernetes-upgrades zonder stress', '4 Nov · Dutch', 'Draft', '#E1EDD5'],
      ['Five questions before you migrate to AWS', '28 Oct · English', '', '#EADFCB'],
      ['Waarom wij infrastructuur bouwen met Nix', '15 Oct · Dutch', '', '#DCE7F7'],
      ['Reserved Instances or Savings Plans?', '2 Oct · English', '', '#EDE4F6'],
      ['Maak kennis met het managed services-team', '19 Sep · Dutch', '', '#F3E3D3']
    ];
    return {
      posts: raw.map(([title, date, status, thumb], i) => ({
        title, date, status, thumb, badge: !!status,
        fg: status ? S[status][0] : '', bg: status ? S[status][1] : '',
        rowStyle: i ? 'border-top: 1px solid #F1F1EE' : ''
      }))
    };
  }
}
</script>
</body>
</html>
