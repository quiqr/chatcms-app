<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #18181B; background: #FFFFFF">
  <header style="flex: none; padding: 52px 12px 10px; background: #FFFFFF; border-bottom: 1px solid #E5E5E2; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 6px">
      <span style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span>
      <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Protecting the Lear’s macaw</span>
    </div>
    <div role="group" aria-label="View" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; background: #F1F1EE; border-radius: 10px; margin: 0 4px">
      <span style="height: 36px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #52525B">Edit</span>
      <span style="height: 36px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #52525B">Preview</span>
      <span style="height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 7px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(16,24,40,.08); font-size: 14px; font-weight: 500">Chat</span>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px">
    <figure aria-label="Request made on the preview" style="align-self: flex-end; width: 280px; margin: 0; background: #F1F1EE; border-radius: 14px 14px 4px 14px; padding: 8px; display: flex; flex-direction: column; gap: 8px">
      <div aria-hidden="true" style="background: #FFFFFF; border-radius: 9px; border: 1px solid #E5E5E2; padding: 10px 12px; font-family: 'Source Serif 4', Georgia, serif; font-size: 11px; line-height: 1.55; color: #26332A; height: 58px; overflow: hidden; box-sizing: border-box">Before construction started, <span style="background: rgba(11,107,170,.22); border-radius: 2px">our team surveyed the nesting cliffs over three breeding seasons</span> and shared every…</div>
      <span style="padding: 0 4px; font-size: 15px; line-height: 1.45">Mention it was 2019–2022</span>
      <figcaption style="padding: 0 4px 2px; font-size: 12px; color: #6B6B73">From the preview</figcaption>
    </figure>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5">
      <span>Done. I added the years to the sentence.</span>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid #E5E5E2; border-radius: 10px; font-size: 14px">
        <span style="display: flex; align-items: center; gap: 8px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Changed Protecting the Lear’s macaw</span>
        <span style="display: flex; gap: 8px; padding-left: 23px">
          <button type="button" style="height: 44px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #0B6BAA">Show changes</button>
          <button type="button" style="height: 44px; padding: 0 12px; border: 1px solid #E5E5E2; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500">Undo</button>
        </span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5">
      <span>Should the intro say “northeastern Bahia” or just “Bahia”?</span>
    </div>
  </div>

  <form style="flex: none; padding: 10px 12px 30px; border-top: 1px solid #EDEDEA; display: flex; align-items: flex-end; gap: 8px">
    <label for="pmsg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message the assistant</label>
    <textarea id="pmsg" rows="1" placeholder="Reply or ask a change" style="flex: 1; min-width: 0; min-height: 44px; box-sizing: border-box; border: 1px solid #D9D9D5; border-radius: 12px; outline: 0; resize: none; font: inherit; font-size: 16px; line-height: 1.4; padding: 10px 12px"></textarea>
    <button type="submit" aria-label="Send" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: #E5E5E2; color: #6B6B73; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
