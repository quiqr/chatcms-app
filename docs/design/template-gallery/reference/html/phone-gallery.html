<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiqr ChatCMS — Templates on a phone</title>


<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6BAA}a:hover{color:#08578C}
</style>

<style>
html,body{background:#F7F7F5}
.qp-screens{position:fixed;right:calc(12px + env(safe-area-inset-right, 0px));bottom:calc(96px + env(safe-area-inset-bottom, 0px));z-index:50;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:#18181B;color:#FAFAFA;font:500 13px Geist,ui-sans-serif,system-ui,sans-serif;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.qp-screens:hover{color:#FFFFFF;background:#27272A}
.qp-screens:focus-visible{outline:2px solid #37B6FF;outline-offset:2px}
</style>
</head>
<body>

<div style="max-width: 480px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F7F7F5; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 12px; background: #FFFFFF; border-bottom: 1px solid #E5E5E2; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="onboarding.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18181B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #6B6B73">New project</span><span style="font-size: 17px; font-weight: 600">Choose a template</span></span>
    </div>
    <label style="height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; margin: 0 4px; border: 1px solid #E5E5E2; border-radius: 10px; background: #FBFBFA">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search templates</span>
      <input type="search" placeholder="Search templates" style="border: 0; outline: 0; font: inherit; font-size: 16px; flex: 1; min-width: 0; background: transparent">
    </label>
  </header>
  <main style="flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
    
      <article style="background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 14px; overflow: hidden">
        <div style="height: 150px; background: #F6D9A8; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #5A3410">Summer</div>
        <div style="padding: 12px 14px; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Summer</span><span style="font-size: 13px; color: #52525B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Simple fresh looking recipe site</span></span>
          <a href="use-template.html" style="height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 8px; background: #0B6BAA; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Use</a>
        </div>
      </article>
    
      <article style="background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 14px; overflow: hidden">
        <div style="height: 150px; background: #D8E6D2; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #1F3B1A">Scroll</div>
        <div style="padding: 12px 14px; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Scroll</span><span style="font-size: 13px; color: #52525B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">One-page site for a coach or consultant</span></span>
          <a href="use-template.html" style="height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 8px; background: #0B6BAA; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Use</a>
        </div>
      </article>
    
      <article style="background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 14px; overflow: hidden">
        <div style="height: 150px; background: #B9F3EF; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #0F3D3A">UILite</div>
        <div style="padding: 12px 14px; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">UILite</span><span style="font-size: 13px; color: #52525B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Personal portfolio and CV</span></span>
          <a href="use-template.html" style="height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 8px; background: #0B6BAA; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Use</a>
        </div>
      </article>
    
  </main>
</div>


</body>
</html>
