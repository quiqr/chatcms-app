<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiqr ChatCMS — Templates on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6BAA}a:hover{color:#08578C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F7F5; font-family: Geist, ui-sans-serif, system-ui, sans-serif; color: #18181B; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 52px 12px 12px; background: #FFFFFF; border-bottom: 1px solid #E5E5E2; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="Onboarding.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18181B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
      <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #6B6B73">New project</span><span style="font-size: 17px; font-weight: 600">Choose a template</span></span>
    </div>
    <label style="height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; margin: 0 4px; border: 1px solid #E5E5E2; border-radius: 10px; background: #FBFBFA">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6B73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search templates</span>
      <input type="search" placeholder="Search templates" style="border: 0; outline: 0; font: inherit; font-size: 16px; flex: 1; min-width: 0; background: transparent">
    </label>
  </header>
  <main style="flex: 1; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{items}}" as="t" hint-placeholder-count="3">
      <article style="background: #FFFFFF; border: 1px solid #E5E5E2; border-radius: 14px; overflow: hidden">
        <div style="height: 150px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: {{t.fg}}">{{t.name}}</div>
        <div style="padding: 12px 14px; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{t.name}}</span><span style="font-size: 13px; color: #52525B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.desc}}</span></span>
          <a href="TplSetup.dc.html" style="height: 40px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 8px; background: #0B6BAA; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Use</a>
        </div>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { items: [
      { name: 'Summer', desc: 'Simple fresh looking recipe site', bg: '#F6D9A8', fg: '#5A3410' },
      { name: 'Scroll', desc: 'One-page site for a coach or consultant', bg: '#D8E6D2', fg: '#1F3B1A' },
      { name: 'UILite', desc: 'Personal portfolio and CV', bg: '#B9F3EF', fg: '#0F3D3A' }
    ] };
  }
}
</script>
</body>
</html>
